<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Système-Solaire-Direct</title>

  <!-- Configuration PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1146/1146303.png">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    /* Panneau d'informations UI */
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      z-index: 5;
    }
    #ui h1 {
      margin: 0 0 5px 0;
      font-size: 1.1rem;
      color: #4da6ff;
    }
    #ui p {
      margin: 3px 0;
      font-size: 0.85rem;
    }

    /* Bouton d'activation du Gyroscope */
    #btn-gyro {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      padding: 10px 18px;
      background: #4da6ff;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    #btn-gyro:active {
      background: #3385d6;
    }

    /* Étiquettes des planètes */
    .planet-label {
      position: absolute;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.6);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      pointer-events: none;
      white-space: nowrap;
      transform: translate(-50%, -100%);
      display: none;
      z-index: 2;
    }
  </style>

  <!-- Bibliothèques Three.js & Astronomy Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.min.js"></script>
</head>
<body>

  <!-- Interface Utilisateur -->
  <div id="ui">
    <h1>🪐 Système-Solaire-Direct</h1>
    <p><b>Temps UTC :</b> <span id="time-display">--</span></p>
    <p><b>Phase de la Lune :</b> <span id="moon-phase">--</span></p>
  </div>

  <!-- Bouton Gyroscope -->
  <button id="btn-gyro">Activer le Gyroscope</button>

  <!-- Étiquettes 2D projetées sur la scène 3D -->
  <div id="labels">
    <div id="label-sun" class="planet-label">☀️ Soleil</div>
    <div id="label-earth" class="planet-label">🌍 Terre</div>
    <div id="label-moon" class="planet-label">🌙 Lune</div>
  </div>

  <!-- Script principal de l'application -->
  <script src="app.js"></script>

  <!-- Enregistrement du Service Worker PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker enregistré avec succès !', reg))
          .catch((err) => console.error('Échec de l\'enregistrement du Service Worker :', err));
      });
    }
  </script>

</body>
</html>
