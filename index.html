<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système Solaire Direct</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .info-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            max-width: 380px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .info-title {
            font-size: 16px;
            font-weight: bold;
            color: #4da6ff;
            margin-bottom: 6px;
        }
        .info-text {
            font-size: 13px;
            color: #ddd;
            line-height: 1.4;
        }

        /* Style des étiquettes toujours visibles */
        .planet-label {
            position: absolute;
            background: rgba(15, 15, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            pointer-events: none;
            white-space: nowrap;
            transform: translate(-50%, -120%);
            z-index: 5;
            transition: opacity 0.15s ease;
        }

        .controls-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .btn-gyro {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }
        .btn-gyro.active {
            background: #ef4444;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="info-panel">
        <div class="info-title">🪐 Système-Solaire-Direct</div>
        <div class="info-text"><b>Temps UTC :</b> <span id="utc-time">--</span></div>
        <div class="info-text"><b>Mode :</b> Positions orbitales en temps réel</div>
    </div>

    <div id="labels-container"></div>
    <div id="canvas-container"></div>

    <div class="controls-bar">
        <button id="gyro-btn" class="btn-gyro">Activer le Gyroscope</button>
    </div>

    <script>
        // --- 1. HORLOGE UTC ---
        function updateUTC() {
            const now = new Date();
            document.getElementById('utc-time').textContent = now.toUTCString();
        }
        setInterval(updateUTC, 1000);
        updateUTC();

        // --- 2. THREE.JS INITIALISATION ---
        const container = document.getElementById('canvas-container');
        const labelsContainer = document.getElementById('labels-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 50, 85);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lumière du Soleil
        const sunLight = new THREE.PointLight(0xffffff, 2.2, 500);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x404040));

        // --- 3. PARAMÈTRES DES ASTRES (Périodes de révolution réelles en jours terrestres) ---
        const planetsData = [
            { name: "Soleil", color: 0xffcc00, size: 3.5, dist: 0, period: 1 },
            { name: "Mercure", color: 0xaaaaaa, size: 0.5, dist: 7, period: 87.97 },
            { name: "Vénus", color: 0xe3bb76, size: 0.8, dist: 10, period: 224.7 },
            { name: "Terre", color: 0x2b82c5, size: 0.9, dist: 14, period: 365.25 },
            { name: "Lune", color: 0xcccccc, size: 0.25, dist: 2.0, period: 27.3, parent: "Terre" },
            { name: "Mars", color: 0xc1440e, size: 0.7, dist: 19, period: 686.98 },
            { name: "Jupiter", color: 0xb07f35, size: 2.2, dist: 27, period: 4332.59 },
            { name: "Saturne", color: 0xe2bf7d, size: 1.8, dist: 36, period: 10759.22, ring: true },
            { name: "Uranus", color: 0x4b70dd, size: 1.2, dist: 45, period: 30685.4 },
            { name: "Neptune", color: 0x274687, size: 1.1, dist: 53, period: 60189.0 }
        ];

        const planets = [];

        planetsData.forEach(data => {
            const geometry = new THREE.SphereGeometry(data.size, 32, 32);
            let material = (data.name === "Soleil") 
                ? new THREE.MeshBasicMaterial({ color: data.color })
                : new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.7 });

            const mesh = new THREE.Mesh(geometry, material);

            // Dessin de l'orbite
            if (data.dist > 0 && !data.parent) {
                const orbitGeo = new THREE.BufferGeometry();
                const points = [];
                for (let i = 0; i <= 128; i++) {
                    const theta = (i / 128) * Math.PI * 2;
                    points.push(new THREE.Vector3(Math.cos(theta) * data.dist, 0, Math.sin(theta) * data.dist));
                }
                orbitGeo.setFromPoints(points);
                const orbitMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12 });
                scene.add(new THREE.Line(orbitGeo, orbitMat));
            }

            // Anneaux de Saturne
            if (data.ring) {
                const ringGeo = new THREE.RingGeometry(data.size + 0.4, data.size + 1.6, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xa68c6d, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI / 2;
                mesh.add(ringMesh);
            }

            // Création de l'étiquette HTML
            const label = document.createElement('div');
            label.className = 'planet-label';
            label.textContent = data.name;
            labelsContainer.appendChild(label);

            scene.add(mesh);

            planets.push({
                ...data,
                mesh: mesh,
                label: label
            });
        });

        // --- 4. CALCUL TEMPS RÉEL DE POSITIONMENT ---
        function updatePositions() {
            // Epoch de référence : 1er Janvier 2026 à 00:00:00 UTC
            const refDate = new Date(Date.UTC(2026, 0, 1, 0, 0, 0)).getTime();
            const now = Date.now();
            const daysPassed = (now - refDate) / (1000 * 60 * 60 * 24);

            const terreObj = planets.find(p => p.name === "Terre");

            planets.forEach(p => {
                if (p.dist > 0) {
                    // Position orbitale calculée selon le nombre de jours écoulés en temps réel
                    const angle = (daysPassed / p.period) * Math.PI * 2;

                    if (p.parent === "Terre" && terreObj) {
                        p.mesh.position.x = terreObj.mesh.position.x + Math.cos(angle) * p.dist;
                        p.mesh.position.z = terreObj.mesh.position.z + Math.sin(angle) * p.dist;
                    } else {
                        p.mesh.position.x = Math.cos(angle) * p.dist;
                        p.mesh.position.z = Math.sin(angle) * p.dist;
                    }
                }
            });
        }

        // --- 5. SUIVI FLUIDE DES ÉTIQUETTES (SANS DISPARITION INTEMPESTIVE) ---
        function updateLabels() {
            const tempV = new THREE.Vector3();

            planets.forEach(p => {
                p.mesh.getWorldPosition(tempV);
                tempV.project(camera);

                const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
                const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;

                // Masquer seulement si l'astre est hors écran (en dehors du viewport canvas)
                if (tempV.z > 1 || x < -20 || x > window.innerWidth + 20 || y < -20 || y > window.innerHeight + 20) {
                    p.label.style.opacity = '0';
                } else {
                    p.label.style.opacity = '1';
                    p.label.style.left = `${x}px`;
                    p.label.style.top = `${y}px`;
                }
            });
        }

        // --- 6. BOUCLE D'ANIMATION ---
        function animate() {
            requestAnimationFrame(animate);

            updatePositions();

            // Rotation propre des astres sur eux-mêmes
            planets.forEach(p => p.mesh.rotation.y += 0.003);

            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
        animate();

        // --- 7. GYROSCOPE ---
        const gyroBtn = document.getElementById('gyro-btn');
        let gyroActive = false;

        function handleOrientation(event) {
            if (!gyroActive) return;
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            camera.rotation.x = beta * 0.1;
            camera.rotation.y = alpha * 0.1;
        }

        gyroBtn.addEventListener('click', () => {
            if (!gyroActive) {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            setGyroState(true);
                        }
                    });
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                    setGyroState(true);
                }
            } else {
                window.removeEventListener('deviceorientation', handleOrientation);
                setGyroState(false);
            }
        });

        function setGyroState(active) {
            gyroActive = active;
            gyroBtn.textContent = active ? "Désactiver le Gyroscope" : "Activer le Gyroscope";
            gyroBtn.classList.toggle('active', active);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
