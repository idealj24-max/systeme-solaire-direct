<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système Solaire & Carte GPS</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #map-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        .info-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            max-width: 380px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            z-index: 10;
        }
        .info-title {
            font-size: 16px;
            font-weight: bold;
            color: #4da6ff;
            margin-bottom: 6px;
        }
        .info-text {
            font-size: 13px;
            color: #ddd;
            line-height: 1.4;
        }

        .planet-label {
            position: absolute;
            background: rgba(15, 15, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            pointer-events: none;
            white-space: nowrap;
            transform: translate(-50%, -120%);
            z-index: 5;
            transition: opacity 0.15s ease;
        }

        .controls-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        .btn-ui {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }
        .btn-ui.active {
            background: #ef4444;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="info-panel">
        <div class="info-title">🪐 Système Solaire HD & GPS</div>
        <div class="info-text"><b>Temps UTC :</b> <span id="utc-time">--</span></div>
        <div class="info-text"><b>GPS :</b> <span id="gps-status">Recherche...</span></div>
    </div>

    <div id="labels-container"></div>
    <div id="canvas-container"></div>
    <div id="map-container"></div>

    <div class="controls-bar">
        <button id="focus-earth-btn" class="btn-ui">Zoomer sur la Terre</button>
        <button id="toggle-map-btn" class="btn-ui">Basculer Carte 2D</button>
    </div>

    <script>
        // 1. HORLOGE UTC
        function updateUTC() {
            document.getElementById('utc-time').textContent = new Date().toUTCString();
        }
        setInterval(updateUTC, 1000);
        updateUTC();

        // 2. INITIALISATION THREE.JS
        const container = document.getElementById('canvas-container');
        const labelsContainer = document.getElementById('labels-container');
        const mapContainer = document.getElementById('map-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2500);
        camera.position.set(0, 60, 110);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1.2;
        controls.maxDistance = 500;

        const sunLight = new THREE.PointLight(0xffffff, 2.0, 2000);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x333333));

        const textureLoader = new THREE.TextureLoader();

        // 3. PLANÈTES ET ASTRES
        const planetsData = [
            { name: "Soleil", texture: "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/lava/lavatile.jpg", size: 3.5, dist: 0, period: 1 },
            { name: "Mercure", texture: "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/mercury.jpg", size: 0.5, dist: 7, period: 87.97 },
            { name: "Vénus", texture: "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/venus_atmosphere.jpg", size: 0.8, dist: 10, period: 224.7 },
            { name: "Terre", texture: "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg", size: 1.0, dist: 14, period: 365.25 },
            { name: "Lune", texture: "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/moon_1024.jpg", size: 0.25, dist: 2.0, period: 27.3, parent: "Terre" },
            { name: "Mars", texture: "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/mars.jpg", size: 0.7, dist: 19, period: 686.98 },
            { name: "Jupiter", texture: "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/jupiter.jpg", size: 2.2, dist: 26, period: 4332.59 },
            { name: "Saturne", texture: "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/jupiter.jpg", size: 1.8, dist: 34, period: 10759.22, ring: true },
            { name: "Uranus", texture: "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/mercury.jpg", size: 1.2, dist: 42, period: 30685.4 },
            { name: "Neptune", texture: "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/venus_atmosphere.jpg", size: 1.2, dist: 50, period: 60189.0 },
            { name: "Pluton", texture: "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/moon_1024.jpg", size: 0.4, dist: 56, period: 90560.0 }
        ];

        const planets = [];
        let earthMesh = null;
        let userCoords = { lat: 18.07, lon: -15.95 }; // Coordonnées par défaut

        planetsData.forEach(data => {
            const geometry = new THREE.SphereGeometry(data.size, 32, 32);
            const mapTexture = textureLoader.load(data.texture);
            
            const material = (data.name === "Soleil") 
                ? new THREE.MeshBasicMaterial({ map: mapTexture }) 
                : new THREE.MeshStandardMaterial({ map: mapTexture, roughness: 0.6 });

            const mesh = new THREE.Mesh(geometry, material);

            if (data.ring) {
                const ringGeo = new THREE.RingGeometry(data.size * 1.3, data.size * 2.1, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xa6a6a6, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI / 2;
                mesh.add(ringMesh);
            }

            if (data.name === "Terre") earthMesh = mesh;

            const label = document.createElement('div');
            label.className = 'planet-label';
            label.textContent = data.name;
            labelsContainer.appendChild(label);

            scene.add(mesh);
            planets.push({ ...data, mesh, label });
        });

        // 4. LEAFLET MAP (CARTE 2D RÉELLE)
        const leafletMap = L.map('map-container', { zoomControl: true }).setView([userCoords.lat, userCoords.lon], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(leafletMap);
        let leafletMarker = L.marker([userCoords.lat, userCoords.lon]).addTo(leafletMap);

        // 5. GÉOLOCALISATION ET REPERE 3D
        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -(radius * Math.sin(phi) * Math.cos(theta)),
                (radius * Math.cos(phi)),
                (radius * Math.sin(phi) * Math.sin(theta))
            );
        }

        function setLocation(lat, lon, labelText) {
            userCoords = { lat, lon };
            document.getElementById('gps-status').textContent = `${labelText} (${lat.toFixed(2)}°, ${lon.toFixed(2)}°)`;

            const markerGeo = new THREE.SphereGeometry(0.03, 16, 16);
            const markerMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const userMarker3D = new THREE.Mesh(markerGeo, markerMat);
            userMarker3D.position.copy(latLonToVector3(lat, lon, 1.01));
            earthMesh.add(userMarker3D);

            leafletMap.setView([lat, lon], 12);
            leafletMarker.setLatLng([lat, lon]);
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                pos => setLocation(pos.coords.latitude, pos.coords.longitude, "Position GPS"),
                () => setLocation(userCoords.lat, userCoords.lon, "Position par défaut (GPS désactivé)")
            );
        } else {
            setLocation(userCoords.lat, userCoords.lon, "GPS non supporté");
        }

        // 6. GESTION DU BASCULEMENT DE LA CARTE 2D
        let isMapVisible = false;

        function showMap(show) {
            isMapVisible = show;
            if (show) {
                mapContainer.classList.add('active');
                setTimeout(() => leafletMap.invalidateSize(), 200);
            } else {
                mapContainer.classList.remove('active');
            }
        }

        document.getElementById('toggle-map-btn').addEventListener('click', () => {
            showMap(!isMapVisible);
        });

        // 7. BOUCLE D'ANIMATION
        function animate() {
            requestAnimationFrame(animate);

            // Mouvement des planètes
            const days = Date.now() / 100000;
            const terreObj = planets.find(p => p.name === "Terre");

            planets.forEach(p => {
                if (p.dist > 0) {
                    const angle = (days / p.period) * Math.PI * 2;
                    if (p.parent === "Terre" && terreObj) {
                        p.mesh.position.x = terreObj.mesh.position.x + Math.cos(angle) * p.dist;
                        p.mesh.position.z = terreObj.mesh.position.z + Math.sin(angle) * p.dist;
                    } else {
                        p.mesh.position.x = Math.cos(angle) * p.dist;
                        p.mesh.position.z = Math.sin(angle) * p.dist;
                    }
                }
            });

            if (earthMesh) earthMesh.rotation.y += 0.001;

            // Mise à jour des étiquettes texte
            const tempV = new THREE.Vector3();
            planets.forEach(p => {
                p.mesh.getWorldPosition(tempV);
                tempV.project(camera);
                const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
                const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;

                if (tempV.z > 1 || x < 0 || x > window.innerWidth || y < 0 || y > window.innerHeight || isMapVisible) {
                    p.label.style.opacity = '0';
                } else {
                    p.label.style.opacity = '1';
                    p.label.style.left = `${x}px`;
                    p.label.style.top = `${y}px`;
                }
            });

            // Bascule automatique de la carte 2D si la caméra est très proche de la Terre
            if (earthMesh) {
                const distToEarth = camera.position.distanceTo(earthMesh.position);
                if (distToEarth < 2.0 && !isMapVisible) {
                    showMap(true);
                } else if (distToEarth >= 2.5 && isMapVisible) {
                    showMap(false);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 8. BOUTONS
        document.getElementById('focus-earth-btn').addEventListener('click', () => {
            if (!earthMesh) return;
            showMap(false);
            controls.target.copy(earthMesh.position);
            camera.position.set(earthMesh.position.x + 2, earthMesh.position.y + 1, earthMesh.position.z + 2);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            leafletMap.invalidateSize();
        });
    </script>
</body>
</html>
