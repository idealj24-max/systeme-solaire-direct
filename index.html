<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Système-Solaire-Direct</title>

  <!-- Configuration PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1146/1146303.png">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    /* Panneau d'informations UI */
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      z-index: 5;
    }
    #ui h1 {
      margin: 0 0 5px 0;
      font-size: 1.1rem;
      color: #4da6ff;
    }
    #ui p {
      margin: 3px 0;
      font-size: 0.85rem;
    }

    /* Bouton Gyroscope */
    #btn-gyro {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      padding: 10px 18px;
      background: #4da6ff;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    #btn-gyro:active {
      background: #3385d6;
    }

    /* Étiquettes des planètes */
    .planet-label {
      position: absolute;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.6);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      pointer-events: none;
      white-space: nowrap;
      transform: translate(-50%, -100%);
      display: none;
      z-index: 2;
    }
  </style>

  <!-- Import Map ESM pour la gestion de Three.js -->
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.min.js"></script>
</head>
<body>

  <!-- Interface Utilisateur -->
  <div id="ui">
    <h1>🪐 Système-Solaire-Direct</h1>
    <p><b>Temps UTC :</b> <span id="time-display">--</span></p>
    <p><b>Phase de la Lune :</b> <span id="moon-phase">--</span></p>
  </div>

  <!-- Bouton Gyroscope -->
  <button id="btn-gyro">Activer le Gyroscope</button>

  <!-- Étiquettes 2D -->
  <div id="labels">
    <div id="label-sun" class="planet-label">☀️ Soleil</div>
    <div id="label-mercury" class="planet-label">☿ Mercure</div>
    <div id="label-venus" class="planet-label">♀️ Vénus</div>
    <div id="label-earth" class="planet-label">🌍 Terre</div>
    <div id="label-moon" class="planet-label">🌙 Lune</div>
    <div id="label-mars" class="planet-label">♂️ Mars</div>
    <div id="label-jupiter" class="planet-label">♃ Jupiter</div>
    <div id="label-saturn" class="planet-label">♄ Saturne</div>
    <div id="label-uranus" class="planet-label">⛢ Uranus</div>
    <div id="label-neptune" class="planet-label">♆ Neptune</div>
  </div>

  <!-- Application Web3D sous forme de module ES6 -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Implémentation du Gyroscope
    class MobileGyroControls {
      constructor(camera) {
        this.camera = camera;
        this.enabled = true;
        this.deviceOrientation = {};

        const onDeviceOrientationChangeEvent = (event) => {
          this.deviceOrientation = event;
        };

        window.addEventListener('deviceorientation', onDeviceOrientationChangeEvent, false);

        this.update = () => {
          if (this.enabled === false) return;
          const alpha = this.deviceOrientation.alpha ? THREE.MathUtils.degToRad(this.deviceOrientation.alpha) : 0;
          const beta = this.deviceOrientation.beta ? THREE.MathUtils.degToRad(this.deviceOrientation.beta) : 0;
          const gamma = this.deviceOrientation.gamma ? THREE.MathUtils.degToRad(this.deviceOrientation.gamma) : 0;

          const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
          this.camera.quaternion.setFromEuler(euler);
        };

        this.dispose = () => {
          window.removeEventListener('deviceorientation', onDeviceOrientationChangeEvent, false);
        };
      }
    }

    // 1. Initialisation de la scène
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    camera.position.set(0, 60, 110);

    // 2. Contrôles
    let controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    function enableGyro() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              activateGyroControls();
            }
          })
          .catch(console.error);
      } else {
        activateGyroControls();
      }
    }

    function activateGyroControls() {
      if (controls) controls.dispose();
      controls = new MobileGyroControls(camera);
      const btn = document.getElementById('btn-gyro');
      if (btn) btn.style.display = 'none';
    }

    const gyroBtn = document.getElementById('btn-gyro');
    if (gyroBtn) {
      gyroBtn.addEventListener('click', enableGyro);
    }

    // 3. Éclairage
    const ambientLight = new THREE.AmbientLight(0x333333);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffffff, 2, 1000);
    scene.add(sunLight);

    // 4. Soleil
    const sunGeo = new THREE.SphereGeometry(3.5, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    const sunMesh = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sunMesh);

    // 5. Planètes
    const SCALE_AU = 16;
    const segments = 128;

    const planetData = [
      { id: 'mercury', name: 'Mercury', radius: 0.5, color: 0x888888, distAU: 0.39 },
      { id: 'venus',   name: 'Venus',   radius: 0.9, color: 0xe3bb76, distAU: 0.72 },
      { id: 'earth',   name: 'Earth',   radius: 1.0, color: 0x2233ff, distAU: 1.00 },
      { id: 'mars',    name: 'Mars',    radius: 0.7, color: 0xc1440e, distAU: 1.52 },
      { id: 'jupiter', name: 'Jupiter', radius: 2.2, color: 0xb07f35, distAU: 2.80 },
      { id: 'saturn',  name: 'Saturn',  radius: 1.8, color: 0xd2b48c, distAU: 4.20 },
      { id: 'uranus',  name: 'Uranus',  radius: 1.4, color: 0x7df9ff, distAU: 5.60 },
      { id: 'neptune', name: 'Neptune', radius: 1.4, color: 0x4b70dd, distAU: 7.00 }
    ];

    const planets = {};

    function createOrbitLine(radius, color) {
      const geo = new THREE.BufferGeometry();
      const pos = [];
      for (let i = 0; i <= segments; i++) {
        const theta = (i / segments) * Math.PI * 2;
        pos.push(Math.cos(theta) * radius, 0, Math.sin(theta) * radius);
      }
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      const mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.25 });
      return new THREE.Line(geo, mat);
    }

    planetData.forEach(data => {
      const geo = new THREE.SphereGeometry(data.radius, 32, 32);
      const mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.6 });
      const mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);

      const orbit = createOrbitLine(data.distAU * SCALE_AU, data.color);
      scene.add(orbit);

      planets[data.id] = {
        astronomyName: data.name,
        mesh: mesh,
        distAU: data.distAU
      };
    });

    // Anneaux de Saturne
    if (planets.saturn) {
      const ringGeo = new THREE.RingGeometry(2.3, 3.6, 32);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xead6b8, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.rotation.x = Math.PI / 2;
      planets.saturn.mesh.add(ringMesh);
    }

    // Lune
    const moonGeo = new THREE.SphereGeometry(0.3, 32, 32);
    const moonMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8 });
    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
    scene.add(moonMesh);

    const moonOrbit = createOrbitLine(2.2, 0xffffff);
    scene.add(moonOrbit);

    // 6. Mise à jour astronomique
    function updatePositions() {
      if (typeof Astronomy === 'undefined') return;
      const now = new Date();
      
      const timeDisplay = document.getElementById('time-display');
      if (timeDisplay) timeDisplay.innerText = now.toUTCString();

      Object.keys(planets).forEach(id => {
        const p = planets[id];
        const vec = Astronomy.HelioVector(p.astronomyName, now);
        p.mesh.position.set(vec.x * SCALE_AU, vec.z * SCALE_AU, vec.y * SCALE_AU);
      });

      if (planets.earth) {
        const earthMesh = planets.earth.mesh;
        const moonVec = Astronomy.GeoVector('Moon', now, true);
        const scaleMoon = 0.000008;

        moonMesh.position.set(
          earthMesh.position.x + (moonVec.x * scaleMoon),
          earthMesh.position.y + (moonVec.z * scaleMoon),
          earthMesh.position.z + (moonVec.y * scaleMoon)
        );

        moonOrbit.position.copy(earthMesh.position);
      }

      const phase = Astronomy.MoonPhase(now);
      const moonPhaseDisplay = document.getElementById('moon-phase');
      if (moonPhaseDisplay) moonPhaseDisplay.innerText = `${Math.round(phase)}°`;
    }

    // 7. Étiquettes
    function updateLabelPosition(mesh, labelId) {
      const label = document.getElementById(labelId);
      if (!label || !mesh) return;

      const vector = new THREE.Vector3();
      mesh.getWorldPosition(vector);
      vector.project(camera);

      const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
      const y = (vector.y * -0.5 + 0.5) * window.innerHeight;

      if (vector.z < 1) {
        label.style.display = 'block';
        label.style.left = `${x}px`;
        label.style.top = `${y}px`;
      } else {
        label.style.display = 'none';
      }
    }

    function updateAllLabels() {
      updateLabelPosition(sunMesh, 'label-sun');
      updateLabelPosition(moonMesh, 'label-moon');

      Object.keys(planets).forEach(id => {
        if (planets[id]) {
          updateLabelPosition(planets[id].mesh, `label-${id}`);
        }
      });
    }

    // 8. Animation
    function animate() {
      requestAnimationFrame(animate);
      updatePositions();
      if (controls) controls.update();
      updateAllLabels();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Exécution initiale et démarrage
    updatePositions();
    animate();
  </script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker OK', reg))
          .catch((err) => console.error('Service Worker Erreur', err));
      });
    }
  </script>

</body>
</html>
