<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système Solaire Direct</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        /* Panneau d'informations */
        .info-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            max-width: 380px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .info-title {
            font-size: 16px;
            font-weight: bold;
            color: #4da6ff;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .info-text {
            font-size: 13px;
            color: #ddd;
            line-height: 1.4;
        }

        /* Étiquettes 2D fluides et anti-chevauchement */
        .planet-label {
            position: absolute;
            background: rgba(15, 15, 25, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: translate(-50%, -100%);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .planet-label.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Bouton Gyroscope */
        .controls-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .btn-gyro {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            transition: background 0.2s, transform 0.1s;
        }
        .btn-gyro.active {
            background: #ef4444;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
        }
        .btn-gyro:active {
            transform: scale(0.96);
        }
    </style>

    <!-- Inclusion de Three.js et OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="info-panel">
        <div class="info-title">🪐 Système-Solaire-Direct</div>
        <div class="info-text"><b>Temps UTC :</b> <span id="utc-time">--</span></div>
        <div class="info-text"><b>Phase de la Lune :</b> Calcul approximatif</div>
    </div>

    <div id="labels-container"></div>
    <div id="canvas-container"></div>

    <div class="controls-bar">
        <button id="gyro-btn" class="btn-gyro">Activer le Gyroscope</button>
    </div>

    <script>
        // --- 1. HORLOGE UTC ---
        function updateUTC() {
            const now = new Date();
            document.getElementById('utc-time').textContent = now.toUTCString();
        }
        setInterval(updateUTC, 1000);
        updateUTC();

        // --- 2. INITIALISATION THREE.JS ---
        const container = document.getElementById('canvas-container');
        const labelsContainer = document.getElementById('labels-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 45, 70);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 300;

        // Lumière Soleil (Ponctuelle + Ambiante)
        const sunLight = new THREE.PointLight(0xffffff, 2, 500);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x333333));

        // --- 3. CRÉATION DES PLANÈTES ---
        const planetsData = [
            { name: "Soleil", color: 0xffcc00, size: 3.5, dist: 0, speed: 0 },
            { name: "Mercure", color: 0xaaaaaa, size: 0.5, dist: 7, speed: 0.04 },
            { name: "Vénus", color: 0xe3bb76, size: 0.8, dist: 10, speed: 0.015 },
            { name: "Terre", color: 0x2b82c5, size: 0.9, dist: 14, speed: 0.01 },
            { name: "Lune", color: 0xcccccc, size: 0.3, dist: 2.2, speed: 0.05, parent: "Terre" },
            { name: "Mars", color: 0xc1440e, size: 0.7, dist: 19, speed: 0.008 },
            { name: "Jupiter", color: 0xb07f35, size: 2.2, dist: 27, speed: 0.002 },
            { name: "Saturne", color: 0xe2bf7d, size: 1.8, dist: 36, speed: 0.0009, ring: true },
            { name: "Uranus", color: 0x4b70dd, size: 1.2, dist: 45, speed: 0.0004 },
            { name: "Neptune", color: 0x274687, size: 1.1, dist: 53, speed: 0.0001 }
        ];

        const planets = [];

        planetsData.forEach(data => {
            const geometry = new THREE.SphereGeometry(data.size, 32, 32);
            let material;

            if (data.name === "Soleil") {
                material = new THREE.MeshBasicMaterial({ color: data.color });
            } else {
                material = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.8 });
            }

            const mesh = new THREE.Mesh(geometry, material);

            // Orbite visuelle
            if (data.dist > 0 && !data.parent) {
                const orbitGeo = new THREE.BufferGeometry();
                const points = [];
                for (let i = 0; i <= 128; i++) {
                    const theta = (i / 128) * Math.PI * 2;
                    points.push(new THREE.Vector3(Math.cos(theta) * data.dist, 0, Math.sin(theta) * data.dist));
                }
                orbitGeo.setFromPoints(points);
                const orbitMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1 });
                scene.add(new THREE.Line(orbitGeo, orbitMat));
            }

            // Anneaux de Saturne
            if (data.ring) {
                const ringGeo = new THREE.RingGeometry(data.size + 0.5, data.size + 1.8, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xa68c6d, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI / 2;
                mesh.add(ringMesh);
            }

            // Création de l'étiquette HTML
            const label = document.createElement('div');
            label.className = 'planet-label';
            label.textContent = data.name;
            labelsContainer.appendChild(label);

            scene.add(mesh);

            planets.push({
                ...data,
                mesh: mesh,
                label: label,
                angle: Math.random() * Math.PI * 2
            });
        });

        // --- 4. GESTION DES COLLISION ET AFFICHAGE DES ÉTIQUETTES ---
        function updateLabels() {
            const tempV = new THREE.Vector3();
            const positions = [];

            planets.forEach(p => {
                p.mesh.getWorldPosition(tempV);

                // Masquer si la planète est derrière le soleil/caméra
                const distanceToCam = camera.position.distanceTo(tempV);
                tempV.project(camera);

                const isBehind = tempV.z > 1;
                const x = (tempV.x *  .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                // Hors écran ou derrière
                if (isBehind || x < 0 || x > window.innerWidth || y < 0 || y > window.innerHeight) {
                    p.label.classList.add('hidden');
                    return;
                }

                // Détection de chevauchement (Anti-collision)
                let isOverlapping = false;
                for (let pos of positions) {
                    const dist2D = Math.hypot(pos.x - x, pos.y - y);
                    if (dist2D < 35) { // Seuil de chevauchement en pixels
                        isOverlapping = true;
                        break;
                    }
                }

                if (isOverlapping && p.name !== "Soleil") {
                    p.label.classList.add('hidden');
                } else {
                    p.label.classList.remove('hidden');
                    p.label.style.left = `${x}px`;
                    p.label.style.top = `${y}px`;
                    positions.push({ x, y, dist: distanceToCam });
                }
            });
        }

        // --- 5. BOUCLE D'ANIMATION ---
        function animate() {
            requestAnimationFrame(animate);

            // Mettre à jour les positions orbiatles
            const terreObj = planets.find(p => p.name === "Terre");

            planets.forEach(p => {
                if (p.dist > 0) {
                    p.angle += p.speed;
                    if (p.parent === "Terre" && terreObj) {
                        p.mesh.position.x = terreObj.mesh.position.x + Math.cos(p.angle) * p.dist;
                        p.mesh.position.z = terreObj.mesh.position.z + Math.sin(p.angle) * p.dist;
                    } else {
                        p.mesh.position.x = Math.cos(p.angle) * p.dist;
                        p.mesh.position.z = Math.sin(p.angle) * p.dist;
                    }
                }
                p.mesh.rotation.y += 0.01;
            });

            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
        animate();

        // --- 6. GYROSCOPE (Mobile) ---
        const gyroBtn = document.getElementById('gyro-btn');
        let gyroActive = false;

        function handleOrientation(event) {
            if (!gyroActive) return;
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            camera.rotation.x = beta * 0.2;
            camera.rotation.y = alpha * 0.2;
        }

        gyroBtn.addEventListener('click', () => {
            if (!gyroActive) {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            setGyroState(true);
                        }
                    });
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                    setGyroState(true);
                }
            } else {
                window.removeEventListener('deviceorientation', handleOrientation);
                setGyroState(false);
            }
        });

        function setGyroState(active) {
            gyroActive = active;
            gyroBtn.textContent = active ? "Désactiver le Gyroscope" : "Activer le Gyroscope";
            gyroBtn.classList.toggle('active', active);
        }

        // --- 7. REDIMENSIONNEMENT FENÊTRE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
